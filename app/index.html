<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Q8F</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Inter+Tight:wght@200;300;500;600&amp;family=Tinos&amp;family=Playfair+Display:wght@400&amp;family=Bodoni+Moda:wght@400&amp;family=Space+Grotesk:wght@300&amp;family=JetBrains+Mono:wght@300&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="root">
  <div id="bg">
    <img class="bg photo" id="imgA" alt="">
    <img class="bg photo" id="imgB" alt="">
    <video class="bg vid" id="vid" muted playsinline preload="auto"></video>
    <canvas class="bg" id="hold" width="1920" height="1080"></canvas>
  </div>
  <div id="scrim"></div>

  <div id="clock"><div id="time"></div><div id="date"></div></div>
  <div id="caption" class="lg g-clear"><span class="dot"></span><b id="place"></b><span id="detail"></span></div>

  <nav id="rail" aria-label="Q8F">
    <div id="railS" class="railbg lg g-thick"></div>
    <div id="railL" class="railbg lg g-thick"></div>
    <div id="railItems"></div>
  </nav>

  <section id="pHome" class="page">
    <div id="stageWrap"><div id="stage"></div></div>
    <div id="heroName"></div>
    <div id="heroLine"></div>
    <div id="dots" class="lg g-clear"></div>
  </section>

  <section id="pApps" class="page">
    <h1 class="pageTitle">Apps</h1>
    <div id="grid"></div>
  </section>

  <section id="pSet" class="page">
    <div id="setPanel" class="lg g-smoke">
      <h1 class="pageTitle inPanel">Settings</h1>
      <div id="rows"></div>
    </div>
  </section>

  <div id="handoff"><div id="spinner"></div><div id="hoName"></div><div id="hoNote"></div></div>
  <div id="toast" class="lg g-smoke"></div>
  <div id="confirm" class="lg g-smoke" role="dialog" aria-label="Exit Q8F">
    <div class="q">Exit Q8F?</div>
    <div class="btns"><div class="cb" id="cbStay">Stay</div><div class="cb" id="cbExit">Exit</div></div>
  </div>
  <div id="fps"></div>
</div>
<script src="js/media.js"></script>
<script src="js/app.js"></script>
</body>
</html>
